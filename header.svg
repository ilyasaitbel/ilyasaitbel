<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="45%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for Soft Glow Effect -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }
    @keyframes wave-motion {
      0%, 100% { d: path("M 0 300 Q 300 280 600 300 T 1200 295 L 1200 320 L 0 320 Z"); }
      50% { d: path("M 0 295 Q 300 315 600 290 T 1200 305 L 1200 320 L 0 320 Z"); }
    }
    .neon-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: -0.5px;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 1px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #E2E8F0;
    }
    .node-1 { animation: pulse 3s infinite ease-in-out; transform-origin: 180px 80px; }
    .node-2 { animation: pulse 4s infinite ease-in-out 1s; transform-origin: 290px 140px; }
    .node-3 { animation: pulse 3.5s infinite ease-in-out 0.5s; transform-origin: 1020px 90px; }
    .node-4 { animation: pulse 4.5s infinite ease-in-out 1.5s; transform-origin: 1100px 160px; }
  </style>

  <!-- Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="url(#neon-cyan)" stroke-width="1.5" opacity="0.4" />

  <!-- Background Ambient Glow -->
  <circle cx="200" cy="100" r="140" fill="#38BDF8" opacity="0.08" filter="url(#soft-glow)" />
  <circle cx="1000" cy="220" r="160" fill="#818CF8" opacity="0.08" filter="url(#soft-glow)" />

  <!-- Constellation AI Grid Left -->
  <g opacity="0.3" stroke="#38BDF8" stroke-width="1.2">
    <line x1="120" y1="50" x2="180" y2="80" />
    <line x1="180" y1="80" x2="290" y2="140" />
    <line x1="290" y1="140" x2="230" y2="230" />
    <line x1="230" y1="230" x2="110" y2="190" />
    <line x1="110" y1="190" x2="180" y2="80" />
    <circle cx="180" cy="80" r="4.5" fill="#38BDF8" class="node-1" />
    <circle cx="290" cy="140" r="5.5" fill="#818CF8" class="node-2" />
    <circle cx="230" cy="230" r="4" fill="#C084FC" />
    <circle cx="110" cy="190" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Constellation AI Grid Right -->
  <g opacity="0.3" stroke="#818CF8" stroke-width="1.2">
    <line x1="1020" y1="90" x2="1100" y2="160" />
    <line x1="1100" y1="160" x2="1040" y2="240" />
    <line x1="1040" y1="240" x2="930" y2="180" />
    <line x1="930" y1="180" x2="1020" y2="90" />
    <circle cx="1020" cy="90" r="5" fill="#38BDF8" class="node-3" />
    <circle cx="1100" cy="160" r="6" fill="#818CF8" class="node-4" />
    <circle cx="1040" cy="240" r="4" fill="#C084FC" />
    <circle cx="930" cy="180" r="3.5" fill="#38BDF8" />
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(450, 36)">
    <rect x="0" y="0" width="300" height="32" rx="16" fill="url(#badge-glow)" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" class="badge-text">YOUCODE (UM6P) • MOROCCO 🇲🇦</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="128" text-anchor="middle" class="neon-title" fill="url(#neon-cyan)" filter="url(#soft-glow)">Ilyas Ait Benlhoussain</text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" class="sub-title">Junior AI &amp; Full Stack Developer</text>

  <!-- Technology Pills -->
  <g transform="translate(185, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="38" rx="19" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
    <text x="72" y="24" text-anchor="middle" class="pill-text">🤖 Agentic AI</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="155" height="38" rx="19" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
    <text x="237" y="24" text-anchor="middle" class="pill-text">⚡ LLMs &amp; RAG</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="175" height="38" rx="19" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
    <text x="417" y="24" text-anchor="middle" class="pill-text">🧠 Machine Learning</text>

    <!-- Pill 4 -->
    <rect x="520" y="0" width="145" height="38" rx="19" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
    <text x="592" y="24" text-anchor="middle" class="pill-text">🚀 FastAPI / Node</text>

    <!-- Pill 5 -->
    <rect x="680" y="0" width="150" height="38" rx="19" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
    <text x="755" y="24" text-anchor="middle" class="pill-text">⚛️ React / Laravel</text>
  </g>

  <!-- Bottom Wave Line -->
  <path d="M 0 305 Q 300 290 600 305 T 1200 300 L 1200 320 L 0 320 Z" fill="url(#wave-grad)" opacity="0.3" />
  <path d="M 0 310 Q 300 318 600 310 T 1200 315 L 1200 320 L 0 320 Z" fill="url(#neon-cyan)" opacity="0.7" />
</svg>
